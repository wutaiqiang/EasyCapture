<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EasyCapture · 区域长截图</title><style>body{margin:0;background:#f4f7fc;color:#24334d;font:16px/1.8 system-ui,"Microsoft YaHei",sans-serif}main{max-width:880px;margin:40px auto;background:white;padding:36px 42px;border:1px solid #e1e8f3;border-radius:18px}h1{font-size:27px}h2{font-size:20px;margin-top:30px}a{color:#3564eb}hr{margin:40px 0;border:0;border-top:1px solid #dce5f3}@media(max-width:640px){main{margin:0;padding:24px;border:0;border-radius:0}}</style><main><img src="icon.png" width="80" height="80" alt="EasyCapture"><h1>EasyCapture</h1><p>点击滚动区域，自动滚动、拼接长图，在本机预览并下载。</p><p>支持整页、表格和侧栏；结束后恢复滚动位置；支持高分屏、固定表头去重和 Esc 取消。</p><p>无需账号，不上传截图，没有广告或跟踪。</p><p><a href="https://github.com/wutaiqiang/EasyCapture/releases/latest">下载扩展</a> · <a href="https://github.com/wutaiqiang/EasyCapture">查看源码</a> · <a href="privacy-policy.html">隐私政策</a> · <a href="https://github.com/wutaiqiang/EasyCapture/issues">问题反馈</a></p><h2>安装到 Edge</h2><p>解压下载的 ZIP，在 <code>edge://extensions</code> 开启开发人员模式，点击“加载解压缩的扩展”，选择含 manifest.json 的文件夹。商店版本发布后将提供商店安装入口。</p></main></html>
